name: backend-test

on:
  push:
    paths:
      - "src/backend/**"
  pull_request:
    paths:
      - "src/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio httpx
      - name: Run pytest
        run: python -m pytest -q
