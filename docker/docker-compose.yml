# 🌐 网络配置
networks:
  agentchat-network:
    driver: bridge

services:
  # MySQL数据库服务
  mysql:
    container_name: agentchat-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 207709
      MYSQL_DATABASE: agentchat
      MYSQL_USER: agentchat_user
      MYSQL_PASSWORD: 207709
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # ← 改为 3307，避免与本地 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - agentchat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis缓存服务
  redis:
    image: redis:7.0-alpine
    container_name: agentchat-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # ← 改为 6380，避免与本地 Redis 冲突
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - agentchat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO对象存储服务
  minio:
    container_name: agentchat-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9000"   # ← 改为 9002，避免与本地 MinIO 冲突
      - "9003:9001"   # ← 改为 9003，控制台端口
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: on-failure
    networks:
      - agentchat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

# 数据卷配置
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local